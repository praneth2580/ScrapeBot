<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrapebot Setup</title>
    <style>
      :root {
        color-scheme: dark;
        --bg0: #0f1419;
        --bg1: #161d25;
        --text: #e8eef4;
        --muted: #9aabbc;
        --accent: #3d9cf0;
        --danger: #f07178;
        --ok: #7fd99a;
        --border: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, #1a2a3a 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #1c2430 0%, transparent 50%),
          var(--bg0);
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
        padding: 32px;
      }

      .panel {
        width: min(520px, 100%);
        background: color-mix(in srgb, var(--bg1) 92%, transparent);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px 28px 24px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.45rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .lede {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.45;
        font-size: 0.95rem;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        font-size: 0.92rem;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 0 rgba(61, 156, 240, 0.5);
        animation: pulse 1.4s ease-out infinite;
      }

      .dot.error {
        background: var(--danger);
        animation: none;
      }

      .dot.done {
        background: var(--ok);
        animation: none;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(61, 156, 240, 0.45);
        }
        70% {
          box-shadow: 0 0 0 10px rgba(61, 156, 240, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(61, 156, 240, 0);
        }
      }

      .log {
        height: 180px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.25);
        padding: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.45;
        color: #c5d0db;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 16px;
      }

      button {
        appearance: none;
        border: 1px solid var(--border);
        background: #243040;
        color: var(--text);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 0.9rem;
        cursor: pointer;
      }

      button.primary {
        background: var(--accent);
        border-color: transparent;
        color: #061018;
        font-weight: 600;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .hint {
        margin-top: 14px;
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>Scrapebot</h1>
      <p class="lede">
        First-time setup downloads the Chromium browser engine used for scraping.
        This is a one-time step (~150–300&nbsp;MB) and is not bundled in the installer.
      </p>

      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="label">Preparing…</span>
      </div>

      <div class="log" id="log" aria-live="polite"></div>

      <div class="actions">
        <button id="retry" class="primary" disabled>Retry download</button>
      </div>

      <p class="hint">
        Needs an internet connection once. Files are stored in your user data folder,
        not inside the app install directory.
      </p>
    </main>

    <script>
      const logEl = document.getElementById("log");
      const labelEl = document.getElementById("label");
      const dotEl = document.getElementById("dot");
      const retryBtn = document.getElementById("retry");

      function appendLog(line) {
        logEl.textContent += (logEl.textContent ? "\n" : "") + line;
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setState({ phase, message }) {
        labelEl.textContent = message || phase;
        dotEl.classList.remove("error", "done");
        if (phase === "error") {
          dotEl.classList.add("error");
          retryBtn.disabled = false;
        } else if (phase === "done") {
          dotEl.classList.add("done");
          retryBtn.disabled = true;
        } else {
          retryBtn.disabled = true;
        }
      }

      window.scrapebotDesktop.onSetupStatus((payload) => {
        if (payload?.line) {
          appendLog(payload.line);
        }
        if (payload?.phase) {
          setState(payload);
        }
      });

      retryBtn.addEventListener("click", () => {
        appendLog("Retrying…");
        setState({ phase: "installing", message: "Downloading Chromium…" });
        window.scrapebotDesktop.retrySetup();
      });

      window.scrapebotDesktop.getSetupState().then((state) => {
        if (state?.logs?.length) {
          for (const line of state.logs) appendLog(line);
        }
        if (state?.phase) {
          setState(state);
        }
      });
    </script>
  </body>
</html>
